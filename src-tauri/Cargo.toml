[package]
name = "schizoboard"
version = "0.1.0"
description = "An infinite corkboard for organising information that hasn't decided what shape it is yet."
authors = ["Phil Wheatley"]
edition = "2021"
# `src/bin/relay.rs` (T-69) made this crate ambiguous: `cargo run` with two
# binaries and no default refuses to pick, and `tauri dev` runs a bare
# `cargo run`. So the documented way to launch the application — `npm run tauri
# dev` — has been failing with "could not determine which binary to run" ever
# since the headless relay landed, while every test kept passing because they
# name their binary.
default-run = "schizoboard"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (rust-lang/cargo#8519).
name = "schizoboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# T-94. Only ever called from Rust, so nothing in `capabilities/` grants the
# webview a single one of its commands — the plugin is here to give
# `asset_export` a path the *user* chose, not to give the frontend dialogs.
#
# It pulls `tauri-plugin-fs` in with it, for the scope type its own file
# commands take. That is a dependency, not an exposure: a plugin's commands are
# unreachable from the webview until a capability lists them, and neither
# plugin appears in ours.
tauri-plugin-dialog = "2"

# T-163. The `schizo://` invite link, which ARCHITECTURE section 5.1 has budgeted
# since the start. Like `dialog` above, neither of these appears in
# `capabilities/` — the webview never calls them. Rust catches the link and
# forwards the string; what a link *means* stays in `app/invite.ts`, because
# Rust owns bytes and no schema (ARCHITECTURE section 4).
tauri-plugin-deep-link = "2"
# Not optional, and not really a second feature. On Windows and Linux the
# operating system answers a `schizo://` click by *launching this application
# again*. Without this plugin that second process opens a second window on the
# same document and the running one never hears about the link; with it, the
# second process hands its arguments to the first and exits, which is the only
# arrangement in which clicking an invite while the board is open does anything
# at all.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# T-233, and the last of ARCHITECTURE section 4.6's planned list with a
# user-visible consequence: without it the window opens centred at 1440x900
# every time, whatever you did to it yesterday. Nothing else in the repo does
# that job — `app/prefs.ts` keeps its preferences in `localStorage`, which the
# webview owns and which knows nothing about the frame around it.
#
# Registered conditionally in `lib.rs`, for the same reason `single-instance`
# is. Also like the two above, it appears in no capability: the plugin ships
# three commands and the webview may call none of them, because a window's
# geometry is the operating system's business and the board's business is
# paper.
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- assets (T-21, T-22) ----------------------------------------------------
# Rust owns bytes (ARCHITECTURE section 4.1): hashing, decode, EXIF, variants.
sha2 = "0.10"
# Only the formats a board can actually hold. The default feature set drags in
# the AVIF encoder — rav1e, ravif and a video-codec tree behind them — which is
# a lot of build for a format nobody is going to paste onto a corkboard.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "rayon",
] }
# Orientation only. `image` can report it too, but the tag is worth reading
# explicitly: a portrait photograph stored landscape-plus-EXIF has to report
# portrait dimensions, or every item made from one is created the wrong shape.
kamadak-exif = "0.6"

# --- bundles (T-84) ---------------------------------------------------------
# `.schizo` is a zip (DATA-MODEL section 12). Writing one by hand is tempting
# and reading one by hand is not: the central directory, data descriptors and
# zip64's two ways of saying the same offset are exactly the sort of format
# corner where a hand-rolled parser is wrong on somebody else's file rather
# than on ours.
#
# `default-features = false` matters more here than anywhere else in this file.
# The default set is every compression method the format has ever had — bzip2,
# lzma, ppmd, xz, zstd, deflate64 — plus AES. A bundle we wrote is deflate and
# stored, so all of that is build time and attack surface for formats this
# application will never emit. `deflate-flate2` is the one method kept, and
# `flate2` and `crc32fast` are already in the tree, so this adds one crate
# rather than a compression zoo.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# URL ingestion, which exists because the webview has a CORS wall and the shell
# does not (ARCHITECTURE section 4.1). Blocking, and called from a blocking
# thread — the alternative is a second async HTTP stack in the binary.
ureq = "3"

# --- reading a document (T-297) ---------------------------------------------
# Q-201's answer. lopdf is a PDF *object model* — the file's cross-reference
# table, its page tree, its content streams and its resources — and nothing
# else. It does not render, and that is the whole reason it was chosen over
# `pdfium-render`: D-46 section 4 settled that pages are re-typeset onto our
# own paper rather than drawn, so a 10 MB Google renderer shipped per platform
# would be paying for the one thing this feature deliberately does not do.
#
# The cost is real and was taken with open eyes: text with its *boxes* means
# walking the content stream ourselves — the text matrix, `Tm`/`Td`/`TD`/`T*`,
# and `Tj`/`TJ`/`'`/`"` — because the object model hands over operators and not
# a laid-out line. `pdf-extract` would have done the loose text for nothing and
# is no use here: a quote has to cite where on the page it came from.
#
# `default-features = false` for the reason it matters on `zip` above: the
# default set is `chrono`, `jiff` and `time` — three separate date libraries,
# all of them for parsing document metadata this application never reads — plus
# `rayon` for a parallel load we do not want on the ingest thread.
lopdf = { version = "0.44", default-features = false }

# --- reading markdown (T-346) -----------------------------------------------
# The one dependency in this file that is here instead of hand-written code,
# and the reason is the shape of the format rather than its size. `text.rs` and
# `cues.rs` are both hand-rolled because their grammars fit on a page — a fixed
# character grid, and a cue that is a number, a timestamp pair and some lines.
# CommonMark is not that: setext headings, lazy continuation, reference links,
# nested emphasis with flanking rules, fenced and indented code, and HTML
# blocks. A subset of it is not a smaller version of markdown, it is a parser
# that reads *some* files wrong and quietly throws the rest of a line away,
# which is the one failure `cues.rs` was written to avoid.
#
# `pulldown-cmark` and not `comrak`, which was the real fork (T-337): comrak
# renders markdown *to HTML*, so choosing it would mean shipping an HTML parser
# as well to get back out of a representation this board never draws. This one
# is a pull parser — an event stream of starts, ends and text, with byte offsets
# into the source — and an event stream is exactly the shape D-65 needs, since
# what comes out of here is a flat string plus role spans over it.
#
# `default-features = false` for `zip` and `lopdf`'s reason, and here it is
# pointed rather than tidy. The defaults are `getopts` and `html` — the first is
# argument parsing for the crate's own bundled binary, and the second pulls
# `pulldown-cmark-escape` to render events *back into HTML*. That is the exact
# thing choosing this crate over comrak was meant to avoid, shipped by default,
# so switching it off is part of the decision rather than a build-size tidy-up.
# What is left is three small crates: `bitflags`, `memchr` and `unicase`.
pulldown-cmark = { version = "0.13", default-features = false }

# --- reading a docx and an epub (T-353, T-354) ------------------------------
# Both formats are XML inside a zip, and the `zip` half is already above. This
# is the other half, and it is an *import* rather than a build: quick-xml is
# already in the tree at this version, pulled in by `plist` behind `tauri`, so
# naming it here adds a line to this file and nothing to the binary.
#
# Hand-rolling was never the option it looks like. WordprocessingML is real XML
# with namespaces, entities and attribute order that carries meaning, and an
# epub adds a container descriptor and a package manifest on top — which is
# `bundle.rs`'s argument for depending on `zip` rather than writing one, in a
# second format.
#
# A pull parser and not a tree, for `pulldown-cmark`'s reason exactly (T-346):
# what comes out of these readers is `prose::Reading`, which is a flat string
# built by walking events in order, and a DOM would mean building a document
# only to walk it once and throw it away.
#
# `default-features = false` drops `encoding`, which reads the eight-bit
# codepages an XML declaration can name. Both of these formats are UTF-8 by
# specification — OPC requires it and EPUB requires UTF-8 or UTF-16 — so that
# feature is a character-set zoo for files neither format permits.
#
# `escape-html` is kept, and the first draft of this file dropped it with a
# comment saying neither format permits an HTML entity. **That was wrong about
# the epub**, and driving one found it: XHTML inherits the entity sets its DTD
# declares, so a real book writes `&mdash;` and `&nbsp;` freely — and without
# this feature those resolved to nothing and were silently deleted from the
# page. Losing a character of somebody's document is the one failure every
# reader in this crate was written to prevent, so the table is worth its size.
quick-xml = { version = "0.41", default-features = false, features = ["escape-html"] }

# --- the embedded relay (T-69) ----------------------------------------------
# The relay holds a real document, because a y-websocket server has to answer a
# state vector with the difference — and because ARCHITECTURE section 5.1 wants
# "the identical binary on a small server as an always-on, always-seeding
# peer", which cannot seed what it does not hold.
#
# This does not reopen the "start frontend-driven" note in section 4: `yrs`
# gives us the CRDT, not the schema. The relay never looks inside a document —
# no items, no pins, no strings — so there are not two implementations of
# anything that has to agree. Headless compaction of *meaning* would be, and
# still is not being done here.
yrs = "0.27"
# The WebSocket half. Tungstenite is the protocol; this is its tokio binding.
tokio-tungstenite = "0.30"
# Tauri already runs a tokio reactor, but the relay asks for more of it than
# Tauri's own feature set enables, so it is declared rather than borrowed.
#
# No `macros`. The feature wants a `tokio-macros` that is not on the index at
# the version tokio is locked to, and all it buys is `#[tokio::main]` — which
# a library that is handed a runtime has no use for anyway.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }

# --- LAN discovery and its secret (T-70) ------------------------------------
# The operating system's CSPRNG and nothing else. `rand` would bring
# distributions and a seedable generator, neither of which a board secret wants
# anywhere near it. Already in the tree at this version, so this is an import
# rather than a build.
getrandom = "0.3"
# DNS-SD over multicast, which DESIGN section 8 names as one of the four things
# that has no browser equivalent and is therefore part of why this is a desktop
# application at all. Pure Rust, so no Bonjour or Avahi to be installed or
# missing at run time.
#
# No `async`: the daemon is a thread with a channel, which is what the browse
# loop wants anyway — it outlives any one command and must not be tied to
# whichever runtime happened to call it. No `serde` either; nothing here is
# serialised.
mdns-sd = { version = "0.20.3", default-features = false, features = ["log"] }

# --- the clipboard's file list (T-266, T-303) -------------------------------
# The paths behind a file copy, so a pasted file takes the same cheap road a
# dropped one already does — 237 ms against 1069 ms on the same file (D-51).
#
# This replaced about seventy lines of hand-written `CF_HDROP`: `OpenClipboard`,
# a `Drop` guard whose only job was to stop an early return wedging copy and
# paste for every application on the machine, and `DragQueryFileW` called twice
# per name. That code worked, and it worked on one platform. `file_list()` is
# implemented on Windows, macOS, X11 and Wayland and hands back decoded
# `PathBuf`s on all four — it strips `file://` and percent-decodes itself,
# which `clipboard-rs`, the other candidate, leaves to every caller (D-59).
#
# Q-238's reasoning was about *this* platform rather than the other two: the
# only clipboard code anyone here can watch run is Windows, so the road worth
# testing is the road all three take. Two implementations of one answer, with
# the tested one the only one nobody else runs, is the arrangement that hides a
# fault rather than the one that finds it.
#
# `default-features = false` drops `image-data`, which would pull a second
# `image` in for a clipboard picture nothing here reads — the paste event
# already hands the webview those. `wayland-data-control` is kept, because
# without it a Linux desktop that is not X11 answers nothing, which is the case
# this dependency exists to close. It is what `tauri-plugin-clipboard-manager`
# is built on, at the same version and with the same feature.
arboard = { version = "3.6", default-features = false, features = [
  "wayland-data-control",
] }

# --- the clipboard's SourceURL (T-97) ---------------------------------------
# CF_HTML carries the page a fragment was copied from, in a header the webview
# strips before the `paste` event ever sees it. Reading it needs the raw Win32
# clipboard, and nothing safe wraps that format. Already in the tree at this
# version via Tauri, so this adds an import rather than a build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }

# --- the PDF export (T-207) -------------------------------------------------
# `ICoreWebView2_7::PrintToPdf`, which is the whole of Q-128's chosen route: the
# handwriting comes out as embedded, subsetted vector text rather than pixels
# (D-36). Tauri exposes `webview.print()` — the *dialog* — and nothing else, so
# reaching the silent one means `with_webview` and a COM call.
#
# Neither of these is a new build. Tauri already pulls both in at exactly these
# versions on Windows, and `tauri::webview::PlatformWebview` hands back
# `webview2-com` types from its own public API, so this is naming a dependency
# that was already in the tree rather than adding one.
#
# `windows` rather than the `windows-sys` above because this is COM: the vtable
# calls need the `Interface` trait and real interface types, which the -sys
# crate does not have.
webview2-com = "0.38"
windows = "0.61"

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Rope solving and image decode are unusable at opt-level 0; the app itself
# still builds nearly unoptimised so dev rebuilds stay quick.
opt-level = 1
# Not a preference. With incremental compilation on, linking the `cdylib` half
# of the lib target fails on Windows with fifty-odd `unresolved external symbol
# anon.<hash>.N.llvm.<id>` errors as soon as `image` is in the graph — the
# known rustc bug where incremental codegen units reference LLVM-internal
# anonymous symbols across the cdylib boundary. `cargo check` and `cargo test`
# are unaffected, so it only shows up the moment someone tries to run the app.
#
# The cdylib and staticlib crate types exist for mobile and cannot be made
# conditional on the target, so this is the lever there is. Rebuilds cost about
# a minute; the alternative is an application that does not link.
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
