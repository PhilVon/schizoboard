[package]
name = "schizoboard"
version = "0.1.0"
description = "An infinite corkboard for organising information that hasn't decided what shape it is yet."
authors = ["Phil Wheatley"]
edition = "2021"
# `src/bin/relay.rs` (T-69) made this crate ambiguous: `cargo run` with two
# binaries and no default refuses to pick, and `tauri dev` runs a bare
# `cargo run`. So the documented way to launch the application — `npm run tauri
# dev` — has been failing with "could not determine which binary to run" ever
# since the headless relay landed, while every test kept passing because they
# name their binary.
default-run = "schizoboard"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (rust-lang/cargo#8519).
name = "schizoboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# T-94. Only ever called from Rust, so nothing in `capabilities/` grants the
# webview a single one of its commands — the plugin is here to give
# `asset_export` a path the *user* chose, not to give the frontend dialogs.
#
# It pulls `tauri-plugin-fs` in with it, for the scope type its own file
# commands take. That is a dependency, not an exposure: a plugin's commands are
# unreachable from the webview until a capability lists them, and neither
# plugin appears in ours.
tauri-plugin-dialog = "2"

# T-163. The `schizo://` invite link, which ARCHITECTURE section 5.1 has budgeted
# since the start. Like `dialog` above, neither of these appears in
# `capabilities/` — the webview never calls them. Rust catches the link and
# forwards the string; what a link *means* stays in `app/invite.ts`, because
# Rust owns bytes and no schema (ARCHITECTURE section 4).
tauri-plugin-deep-link = "2"
# Not optional, and not really a second feature. On Windows and Linux the
# operating system answers a `schizo://` click by *launching this application
# again*. Without this plugin that second process opens a second window on the
# same document and the running one never hears about the link; with it, the
# second process hands its arguments to the first and exits, which is the only
# arrangement in which clicking an invite while the board is open does anything
# at all.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- assets (T-21, T-22) ----------------------------------------------------
# Rust owns bytes (ARCHITECTURE section 4.1): hashing, decode, EXIF, variants.
sha2 = "0.10"
# Only the formats a board can actually hold. The default feature set drags in
# the AVIF encoder — rav1e, ravif and a video-codec tree behind them — which is
# a lot of build for a format nobody is going to paste onto a corkboard.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "webp",
  "rayon",
] }
# Orientation only. `image` can report it too, but the tag is worth reading
# explicitly: a portrait photograph stored landscape-plus-EXIF has to report
# portrait dimensions, or every item made from one is created the wrong shape.
kamadak-exif = "0.6"
# URL ingestion, which exists because the webview has a CORS wall and the shell
# does not (ARCHITECTURE section 4.1). Blocking, and called from a blocking
# thread — the alternative is a second async HTTP stack in the binary.
ureq = "3"

# --- the embedded relay (T-69) ----------------------------------------------
# The relay holds a real document, because a y-websocket server has to answer a
# state vector with the difference — and because ARCHITECTURE section 5.1 wants
# "the identical binary on a small server as an always-on, always-seeding
# peer", which cannot seed what it does not hold.
#
# This does not reopen the "start frontend-driven" note in section 4: `yrs`
# gives us the CRDT, not the schema. The relay never looks inside a document —
# no items, no pins, no strings — so there are not two implementations of
# anything that has to agree. Headless compaction of *meaning* would be, and
# still is not being done here.
yrs = "0.27"
# The WebSocket half. Tungstenite is the protocol; this is its tokio binding.
tokio-tungstenite = "0.30"
# Tauri already runs a tokio reactor, but the relay asks for more of it than
# Tauri's own feature set enables, so it is declared rather than borrowed.
#
# No `macros`. The feature wants a `tokio-macros` that is not on the index at
# the version tokio is locked to, and all it buys is `#[tokio::main]` — which
# a library that is handed a runtime has no use for anyway.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }

# --- LAN discovery and its secret (T-70) ------------------------------------
# The operating system's CSPRNG and nothing else. `rand` would bring
# distributions and a seedable generator, neither of which a board secret wants
# anywhere near it. Already in the tree at this version, so this is an import
# rather than a build.
getrandom = "0.3"
# DNS-SD over multicast, which DESIGN section 8 names as one of the four things
# that has no browser equivalent and is therefore part of why this is a desktop
# application at all. Pure Rust, so no Bonjour or Avahi to be installed or
# missing at run time.
#
# No `async`: the daemon is a thread with a channel, which is what the browse
# loop wants anyway — it outlives any one command and must not be tied to
# whichever runtime happened to call it. No `serde` either; nothing here is
# serialised.
mdns-sd = { version = "0.20.3", default-features = false, features = ["log"] }

# --- the clipboard's SourceURL (T-97) ---------------------------------------
# CF_HTML carries the page a fragment was copied from, in a header the webview
# strips before the `paste` event ever sees it. Reading it needs the raw Win32
# clipboard, and nothing safe wraps that format. Already in the tree at this
# version via Tauri, so this adds an import rather than a build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Rope solving and image decode are unusable at opt-level 0; the app itself
# still builds nearly unoptimised so dev rebuilds stay quick.
opt-level = 1
# Not a preference. With incremental compilation on, linking the `cdylib` half
# of the lib target fails on Windows with fifty-odd `unresolved external symbol
# anon.<hash>.N.llvm.<id>` errors as soon as `image` is in the graph — the
# known rustc bug where incremental codegen units reference LLVM-internal
# anonymous symbols across the cdylib boundary. `cargo check` and `cargo test`
# are unaffected, so it only shows up the moment someone tries to run the app.
#
# The cdylib and staticlib crate types exist for mobile and cannot be made
# conditional on the target, so this is the lever there is. Rebuilds cost about
# a minute; the alternative is an application that does not link.
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
