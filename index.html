<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schizoboard</title>
    <!--
      The board's hand, fetched before anything asks for it (T-81).

      A font is only requested when something is laid out in it, which on this
      board is after the first item mounts — and `items.css` blocks that text
      rather than let a fallback face paint, because a swap re-wraps every note.
      Starting the fetch here means the block is over before there is a note to
      block. `crossorigin` is not optional even same-origin: font requests are
      made in CORS mode, and a preload without it is a second, separate fetch.
    -->
    <link rel="preload" href="/fonts/patrick-hand.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      The clean face is NOT preloaded, deliberately. It is `font-display: block`
      like the hand, so a note set in it blocks the same way — but it is on a
      minority of items on a minority of boards, and preloading it would spend
      15 KB of the opening fetch on most boards that never show it. `block` with
      no preload means those notes come in a beat late on a cold open, which is
      the right side of the trade for something you chose per item.
    -->
    <link rel="stylesheet" href="/src/styles/base.css" />
    <script type="module" src="/src/app/main.ts"></script>
  </head>
  <body>
    <div id="board-root"></div>
  </body>
</html>
